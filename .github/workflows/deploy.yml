
name: Deploy Personal API

on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Test Go application
        run: go test ./...

      - name: Build Linux executable
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 \
            go build -o personal-api .

      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.DROPLET_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.DROPLET_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/known_hosts

      - name: Upload application
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          scp personal-api "$USER@$HOST:/opt/personal-api/personal-api.new"
          scp -r sql "$USER@$HOST:/opt/personal-api/"

      - name: Activate deployment
        env:
          HOST: ${{ secrets.DROPLET_HOST }}
          USER: ${{ secrets.DROPLET_USER }}
        run: |
          ssh "$USER@$HOST" '
            chmod 755 /opt/personal-api/personal-api.new
            mv /opt/personal-api/personal-api.new /opt/personal-api/personal-api
            sudo -n systemctl restart personal-api.service
          '
